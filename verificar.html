<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SEVIA Mobility | Verificar constancia</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F8;--surface:#fff;--ink:#14243B;--muted:#56657A;--line:#CCD7E3;--amber:#E9A100;--green:#1F8A5B;--gs:#DDF3E8;--red:#C73E3E;--rs:#FBE3E3;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1828;--surface:#162437;--ink:#E6EDF5;--muted:#9AAABD;--line:#2C3E56;--amber:#F2B632;--green:#3DBA82;--gs:#123527;--red:#E06666;--rs:#3D1B1E}}
:root[data-theme="dark"]{--bg:#0E1828;--surface:#162437;--ink:#E6EDF5;--muted:#9AAABD;--line:#2C3E56;--amber:#F2B632;--green:#3DBA82;--gs:#123527;--red:#E06666;--rs:#3D1B1E}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Barlow,"Segoe UI",Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:2.4rem;margin:0 0 6px;line-height:1.05}
p.lead{color:var(--muted);margin-top:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:18px}
label{display:block;font-weight:600;font-size:.92rem;margin:12px 0 4px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button{margin-top:18px;background:var(--amber);color:#1b1400;border:0;border-radius:10px;padding:12px 20px;font:700 1rem Barlow,sans-serif;cursor:pointer;width:100%}
.res{margin-top:16px;padding:14px 16px;border-radius:10px;font-weight:600;display:none}
.res.ok{display:block;background:var(--gs);border-left:5px solid var(--green)}
.res.bad{display:block;background:var(--rs);border-left:5px solid var(--red)}
small{color:var(--muted);display:block;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
 <h1>Verificar constancia</h1>
 <p class="lead">Para HubLeaders. Copia los datos exactamente como aparecen en la captura del Driver.</p>
 <div class="panel">
  <label for="n">Nombre completo</label><input id="n" autocomplete="off">
  <label for="t">Turno</label><input id="t" autocomplete="off" placeholder="Ej. V2">
  <label for="s">Evaluación (aciertos)</label><input id="s" inputmode="numeric" autocomplete="off" placeholder="Ej. 9">
  <label for="f">Fecha</label><input id="f" autocomplete="off" placeholder="Ej. 25 septiembre 2026">
  <label for="c">Código de verificación</label><input id="c" autocomplete="off" placeholder="SEV-XXXX-XXXX">
  <button id="go">Verificar</button>
  <div class="res" id="res" aria-live="polite"></div>
  <small>Mayúsculas, acentos y espacios extra no afectan el resultado. La fecha debe coincidir con la de la constancia.</small>
 </div>
</div>
<script>
const SALT='SEVIA-GML-2026';
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
function vcode(n,t,s,f){const x=cyrb53([SALT,norm(n),norm(t).replace(/ /g,''),String(s),norm(f)].join('|')).toString(36).toUpperCase().padStart(8,'0').slice(-8);return 'SEV-'+x.slice(0,4)+'-'+x.slice(4)}
const $=id=>document.getElementById(id);
$('go').onclick=()=>{const v=['n','t','s','f','c'].map(i=>$(i).value.trim());const r=$('res');
 if(v.some(x=>!x)){r.className='res bad';r.textContent='Completa todos los campos.';return}
 const s=parseInt(v[2],10);
 const ok=vcode(v[0],v[1],s,v[3])===v[4].toUpperCase().replace(/\s/g,'');
 r.className='res '+(ok?'ok':'bad');
 r.textContent=ok?(s>=8?'Código válido. La constancia corresponde a estos datos.':'El código corresponde a los datos, pero la calificación no es aprobatoria.'):'El código no corresponde a estos datos. Revisa que estén escritos igual que en la constancia; si coinciden, la constancia pudo haber sido alterada.';};
</script>
</body>
</html>
